
name: Verify Thesis Evidence

on:
  push:
    paths:
      - "evidence/**"
      - "notebooks/**"
      - "scripts/**"
      - ".github/workflows/verify-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify archived experiments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify consolidated SHAP and LIME results
        run: python scripts/audit_stability.py --evidence-dir evidence

      - name: Verify publication notebooks
        run: python scripts/check_public_notebooks.py
